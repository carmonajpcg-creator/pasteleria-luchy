# Revisión semanal de dependencias (auditoría Fase 10, A2). Agrupa las actualizaciones para que lleguen
# como un solo PR por ecosistema; cada PR pasa por la CI completa antes de poder fusionarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint solo admite TypeScript < 6.1: subir el compilador antes rompe el lint
      # (primera ejecución de Dependabot, 2026-10-21). Revisar al actualizar typescript-eslint.
      - dependency-name: typescript
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      acciones:
        patterns: ['*']
