# Revisión semanal de dependencias (auditoría Fase 10, A2). Agrupa las actualizaciones para que lleguen
# como un solo PR por ecosistema; cada PR pasa por la CI completa antes de poder fusionarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      acciones:
        patterns: ['*']
